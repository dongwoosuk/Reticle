<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Diagonal line (curve) -->
  <line x1="6" y1="42" x2="42" y2="6" stroke="#333333" stroke-width="3" stroke-linecap="round" />

  <!-- Center tick (perpendicular to line) -->
  <line x1="15" y1="15" x2="33" y2="33" stroke="#999999" stroke-width="1.5" stroke-dasharray="2,2" />

  <!-- Division points (with black outline) -->
  <circle cx="12" cy="36" r="3" fill="#4A90D9" stroke="#222222" stroke-width="1" />
  <circle cx="19" cy="29" r="3" fill="#4A90D9" stroke="#222222" stroke-width="1" />
  <circle cx="29" cy="19" r="3" fill="#4A90D9" stroke="#222222" stroke-width="1" />
  <circle cx="36" cy="12" r="3" fill="#4A90D9" stroke="#222222" stroke-width="1" />

  <!-- Remainder indicators (at ends) -->
  <line x1="6" y1="42" x2="9" y2="39" stroke="#CC7733" stroke-width="2" stroke-linecap="round" />
  <line x1="39" y1="9" x2="42" y2="6" stroke="#CC7733" stroke-width="2" stroke-linecap="round" />
</svg>
