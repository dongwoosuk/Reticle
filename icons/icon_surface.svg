<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Surface outline (rectangle) -->
  <rect x="4" y="6" width="40" height="36" fill="none" stroke="#333333" stroke-width="2" stroke-linejoin="round" />

  <!-- U division lines (vertical) -->
  <line x1="14" y1="6" x2="14" y2="42" stroke="#333333" stroke-width="1" />
  <line x1="24" y1="6" x2="24" y2="42" stroke="#333333" stroke-width="1" />
  <line x1="34" y1="6" x2="34" y2="42" stroke="#333333" stroke-width="1" />

  <!-- V division lines (horizontal) -->
  <line x1="4" y1="16" x2="44" y2="16" stroke="#333333" stroke-width="1" />
  <line x1="4" y1="32" x2="44" y2="32" stroke="#333333" stroke-width="1" />

  <!-- Remainder zones (dashed borders - U direction: left & right) -->
  <line x1="4" y1="6" x2="4" y2="42" stroke="#CC7733" stroke-width="1.5" stroke-dasharray="2,2" />
  <line x1="14" y1="6" x2="14" y2="42" stroke="#CC7733" stroke-width="1.5" stroke-dasharray="2,2" />
  <line x1="34" y1="6" x2="34" y2="42" stroke="#CC7733" stroke-width="1.5" stroke-dasharray="2,2" />
  <line x1="44" y1="6" x2="44" y2="42" stroke="#CC7733" stroke-width="1.5" stroke-dasharray="2,2" />
  <!-- V direction: top & bottom -->
  <line x1="4" y1="6" x2="44" y2="6" stroke="#CC7733" stroke-width="1.5" stroke-dasharray="2,2" />
  <line x1="4" y1="16" x2="44" y2="16" stroke="#CC7733" stroke-width="1.5" stroke-dasharray="2,2" />
  <line x1="4" y1="32" x2="44" y2="32" stroke="#CC7733" stroke-width="1.5" stroke-dasharray="2,2" />
  <line x1="4" y1="42" x2="44" y2="42" stroke="#CC7733" stroke-width="1.5" stroke-dasharray="2,2" />

  <!-- Center crosshair -->
  <line x1="24" y1="18" x2="24" y2="22.5" stroke="#999999" stroke-width="0.8" stroke-dasharray="1.5,1.5" />
  <line x1="24" y1="25.5" x2="24" y2="30" stroke="#999999" stroke-width="0.8" stroke-dasharray="1.5,1.5" />
  <line x1="16" y1="24" x2="22" y2="24" stroke="#999999" stroke-width="0.8" stroke-dasharray="1.5,1.5" />
  <line x1="26" y1="24" x2="32" y2="24" stroke="#999999" stroke-width="0.8" stroke-dasharray="1.5,1.5" />

  <!-- Grid intersection points -->
  <circle cx="14" cy="16" r="2" fill="#4A90D9" stroke="#222222" stroke-width="0.7" />
  <circle cx="24" cy="16" r="2" fill="#4A90D9" stroke="#222222" stroke-width="0.7" />
  <circle cx="34" cy="16" r="2" fill="#4A90D9" stroke="#222222" stroke-width="0.7" />
  <circle cx="14" cy="32" r="2" fill="#4A90D9" stroke="#222222" stroke-width="0.7" />
  <circle cx="24" cy="32" r="2" fill="#4A90D9" stroke="#222222" stroke-width="0.7" />
  <circle cx="34" cy="32" r="2" fill="#4A90D9" stroke="#222222" stroke-width="0.7" />
</svg>
